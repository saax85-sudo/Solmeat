<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoulPulse.AI - تحليل شفرة الشخصية</title>
    <style>
        body {
            background-color: #0d0a14;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: #181325;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid #2a223d;
        }
        h1 { color: #e91e63; margin-bottom: 5px; }
        h2 { font-size: 20px; margin-bottom: 15px; }
        p { color: #a09cb1; font-size: 14px; margin-bottom: 25px; }
        .file-input-wrapper {
            margin-bottom: 20px;
            text-align: right;
        }
        label { display: block; margin-bottom: 8px; color: #d1c4e9; font-size: 14px; }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            background: #251e36;
            border: 1px dashed #e91e63;
            border-radius: 10px;
            color: #fff;
            box-sizing: border-box;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #e91e63, #9c27b0);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { opacity: 0.9; }
        #result {
            margin-top: 25px;
            padding: 15px;
            background: #251e36;
            border-radius: 10px;
            text-align: right;
            white-space: pre-line;
            line-height: 1.6;
            display: none;
        }
        .loading { display: none; color: #e91e63; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>SoulPulse.AI ♥</h1>
    <h2>حلل شفرة الشخصية التي تحبها</h2>
    <p>ارفاق سكرين شوت لصفحة الحساب أو المنشورات ودع الذكاء الاصطناعي يقرأ الشخصية!</p>

    <form id="analyzeForm">
        <div class="file-input-wrapper">
            <label for="screenshots">اختر صور سكرين شوت (حتى 3 صور):</label>
            <input type="file" id="screenshots" accept="image/*" multiple required>
        </div>
        <button type="submit" id="submitBtn">تحليل الصور ✨</button>
    </form>

    <div class="loading" id="loading">جاري قراءة الصور وتحليل الشخصية... ⏳</div>
    <div id="result"></div>
</div>

<script>
    const form = document.getElementById('analyzeForm');
    const resultDiv = document.getElementById('result');
    const loadingDiv = document.getElementById('loading');

    // تحويل الصورة إلى Base64
    const fileToBase64 = (file) => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fileInput = document.getElementById('screenshots');
        
        if (fileInput.files.length === 0) {
            alert("يرجى اختيار صورة واحدة على الأقل");
            return;
        }

        loadingDiv.style.display = 'block';
        resultDiv.style.display = 'none';

        try {
            const files = Array.from(fileInput.files).slice(0, 3);
            const base64Images = await Promise.all(files.map(fileToBase64));

            const response = await fetch('/api/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ images: base64Images })
            });

            const data = await response.json();
            loadingDiv.style.display = 'none';

            if (data.analysis) {
                resultDiv.innerText = data.analysis;
                resultDiv.style.display = 'block';
            } else {
                alert(data.error || "حدث خطأ أثناء التحليل");
            }
        } catch (err) {
            loadingDiv.style.display = 'none';
            alert("حدث خطأ أثناء الاتصال. أعد المحاولة بعد قليل.");
        }
    });
</script>

</body>
</html>
