<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoulDetector | كاشف القلوب المستقبلي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Cairo', sans-serif; background: #090a0f; color: #ffffff; overflow-x: hidden; }
        .tech-font { font-family: 'Orbitron', sans-serif; }
        .glow-bg {
            position: absolute; width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(236,72,153,0.3) 0%, rgba(99,102,241,0.15) 50%, rgba(0,0,0,0) 70%);
            border-radius: 50%; filter: blur(50px); z-index: 0;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center relative p-4">

    <div class="glow-bg -top-10 -right-10"></div>
    <div class="glow-bg -bottom-10 -left-10"></div>

    <header class="w-full max-w-4xl flex justify-between items-center py-6 z-10">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-heart-pulse text-pink-500 text-2xl animate-pulse"></i>
            <span class="tech-font text-2xl font-black bg-gradient-to-r from-pink-500 to-indigo-500 bg-clip-text text-transparent">
                SoulPulse.AI
            </span>
        </div>
        <span class="text-xs text-gray-400 bg-white/5 px-3 py-1 rounded-full border border-white/10">v2.09</span>
    </header>

    <main class="w-full max-w-2xl z-10 my-auto text-center space-y-8">
        <div class="space-y-3">
            <h1 class="text-3xl md:text-5xl font-extrabold leading-tight">
                حلل شفرة الشخص الذي <span class="bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 bg-clip-text text-transparent">تحبه</span>
            </h1>
            <p class="text-gray-400 text-sm md:text-base max-w-lg mx-auto">
                ضع رابط الحساب ودع الذكاء الاصطناعي يحلل اهتماماته وأسرار كسب قلبه.
            </p>
        </div>

        <div class="glass-card p-2 md:p-3 rounded-2xl flex flex-col sm:flex-row items-center gap-2 border border-white/10">
            <div class="flex items-center pl-3 w-full pr-3">
                <i class="fa-brands fa-instagram text-gray-400 text-xl ml-3"></i>
                <input id="instaUrl" type="url" placeholder="https://instagram.com/username" 
                       class="w-full bg-transparent text-white outline-none text-sm md:text-base placeholder-gray-500 text-left dir-ltr">
            </div>
            <button onclick="analyzeProfile()" class="w-full sm:w-auto bg-gradient-to-r from-pink-500 to-indigo-600 hover:from-pink-600 hover:to-indigo-700 text-white font-semibold px-6 py-3 rounded-xl flex items-center justify-center gap-2 transition-all duration-300 whitespace-nowrap">
                <span>تحليل الحساب</span>
                <i class="fa-solid fa-wand-magic-sparkles text-sm"></i>
            </button>
        </div>

        <div id="loader" class="hidden flex-col items-center justify-center space-y-3 py-6">
            <div class="w-10 h-10 border-4 border-pink-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-xs text-pink-400 animate-pulse">جاري الاتصال بالذكاء الاصطناعي وتحليل الصور...</p>
        </div>

        <div id="results" class="hidden text-right space-y-4 pt-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <div class="glass-card p-4 rounded-xl space-y-2">
                    <div class="flex items-center gap-2 text-pink-400 font-bold">
                        <i class="fa-solid fa-heart"></i>
                        <span>الاهتمامات والمفضلات</span>
                    </div>
                    <p id="res-likes" class="text-sm text-gray-300 leading-relaxed"></p>
                </div>

                <div class="glass-card p-4 rounded-xl space-y-2">
                    <div class="flex items-center gap-2 text-indigo-400 font-bold">
                        <i class="fa-solid fa-plane"></i>
                        <span>الأماكن والسفريات</span>
                    </div>
                    <p id="res-travels" class="text-sm text-gray-300 leading-relaxed"></p>
                </div>

                <div class="glass-card p-4 rounded-xl space-y-2">
                    <div class="flex items-center gap-2 text-red-400 font-bold">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <span>أشياء يُفضل تجنبها</span>
                    </div>
                    <p id="res-dislikes" class="text-sm text-gray-300 leading-relaxed"></p>
                </div>

                <div class="glass-card p-4 rounded-xl space-y-2 border-pink-500/30">
                    <div class="flex items-center gap-2 text-yellow-400 font-bold">
                        <i class="fa-solid fa-key"></i>
                        <span>كيف تكسب مودته؟</span>
                    </div>
                    <p id="res-advice" class="text-sm text-gray-300 leading-relaxed"></p>
                </div>

            </div>
        </div>
    </main>

    <footer class="w-full text-center py-4 text-xs text-gray-600 z-10">
        جميع الحقوق محفوظة © 2026
    </footer>

    <script>
        async function analyzeProfile() {
            const urlInput = document.getElementById('instaUrl').value;
            const loader = document.getElementById('loader');
            const results = document.getElementById('results');

            if(!urlInput) {
                alert("يرجى إدخال رابط الحساب أولاً!");
                return;
            }

            loader.classList.remove('hidden');
            loader.classList.add('flex');
            results.classList.add('hidden');

            try {
                // الاتصال بـ API السيرفر الخارجي
                const response = await fetch('http://localhost:3000/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ profileUrl: urlInput })
                });

                const resData = await response.json();

                if(resData.success) {
                    document.getElementById('res-likes').innerText = resData.data.likes;
                    document.getElementById('res-travels').innerText = resData.data.travels;
                    document.getElementById('res-dislikes').innerText = resData.data.dislikes;
                    document.getElementById('res-advice').innerText = resData.data.advice;

                    results.classList.remove('hidden');
                } else {
                    alert("حدث خطأ أثناء تحليل الحساب.");
                }
            } catch (err) {
                alert("تعذر الاتصال بالسيرفر. تأكد من تشغيل الـ Backend.");
            } finally {
                loader.classList.remove('flex');
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
